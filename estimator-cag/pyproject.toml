[project]
name = "estimator-cag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "greenlet>=3.0.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "pgvector>=0.3.0",
    "pydantic-settings>=2.2.0",
    "litellm>=1.57.0,<2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.2.0",
    "tiktoken>=0.7.0",
    "ulid-py>=1.1.0",
    "streamlit>=1.35.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "ragas>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
