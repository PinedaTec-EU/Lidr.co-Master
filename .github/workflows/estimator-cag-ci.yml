name: estimator-cag-ci

on:
  push:
    paths:
      - ".github/workflows/estimator-cag-ci.yml"
      - "estimator-cag/**"
  pull_request:
    paths:
      - ".github/workflows/estimator-cag-ci.yml"
      - "estimator-cag/**"

jobs:
  test:
    runs-on: [self-hosted, self-hosted-cloud, Linux, X64]
    defaults:
      run:
        working-directory: estimator-cag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Run tests
        run: uv run pytest
