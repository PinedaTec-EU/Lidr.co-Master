name: estimator-cag-ci

on:
  push:
    paths:
      - ".github/workflows/estimator-cag-ci.yml"
      - "estimator-cag/**"
  pull_request:
    paths:
      - ".github/workflows/estimator-cag-ci.yml"
      - "estimator-cag/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator-cag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
