services:
  estimator-cag:
    build:
      context: ./estimator-cag
      dockerfile: Dockerfile
    env_file:
      - ./estimator-cag/.env
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      OLLAMA_API_KEY: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_PORT: 11434
      DOCLING_SERVE_URL: http://docling:5001
      VECTOR_DATABASE_URL: postgresql://postgres:postgres@pgvector:5432/estimator
    ports:
      - "8000:8000"
    depends_on:
      docling:
        condition: service_healthy
      ollama:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve:latest
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles:
      - setup
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "gemma4:e2b"]

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimator"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ollama-data:
  pgvector-data:
